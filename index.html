<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shefaa — Doctor Dashboard" />
    <title>Shefaa · Doctor Dashboard</title>
    <script>
      // Stamped here rather than only after the app boots: the bundle sets the
      // same two attributes, but by then the page has already painted once in
      // the wrong direction and the whole layout visibly jumps.
      try {
        var saved = localStorage.getItem('shefaa.locale')
        var locale = saved === 'en' || saved === 'ar' ? saved : 'ar'
        document.documentElement.lang = locale
        document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr'
      } catch (e) {
        // Storage blocked: the default in the markup stands.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
